[project]
name = "finalproject-zubkov-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор валютного кошелька"
readme = "README.md"
authors = [{ name = "Andrey Zubkov" }]
requires-python = ">=3.10"
dependencies = [
    "prettytable>=3.10",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
